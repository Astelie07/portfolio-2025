  <style>
    
    .archives-explorer-container {
      display: flex;
      min-height: 100vh;
      background-color: var(--color-background);
    }
    
    .archives-sidebar {
      width: 220px;
      background-color: var(--color-primary);
      color: white;
      padding: 1rem;
      border-right: 2px solid var(--color2);
      transition: background var(--transition-duration);
    }
    
    .archives-sidebar ul {
      list-style: none;
    }
    
    .archives-sidebar li {
      cursor: pointer;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
      border-radius: 6px;
      transition: background var(--transition-duration);
    }
    
    .archives-sidebar li:hover,
    .archives-sidebar li.active {
      background-color: var(--color2);
    }
    
    .archives-gallery-display {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: flex-start;
      align-items: flex-start;
      background-color: var(--color-background);
      transition: all var(--transition-duration);
    }
    
    .archives-gallery-section {
      display: none;
      width: 100%;
      flex-wrap: wrap;
      gap: 1rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity var(--transition-duration), transform var(--transition-duration);
    }
    
    .archives-gallery-section.active {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }
    
    .archives-gallery-section img {
      width: 150px;
      height: auto;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow var(--transition-duration);
      box-shadow: var(--box-shadow);
      background-color: white;
    }
    
    .archives-gallery-section img:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }
    
    /* Lightbox */
    .archives-lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      transition: opacity var(--transition-duration);
    }
    
    .archives-lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }
    
    .archives-lightbox.active {
      display: flex;
    }
    
    /* Responsive */
    @media screen and (max-width: 768px) {
      .archives-explorer-container {
        flex-direction: column;
      }
    
      .archives-sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 2px solid var(--color2);
      }
    
      .archives-gallery-display {
        justify-content: center;
      }
    
      .archives-gallery-section {
        justify-content: center;
      }
    }

    .archives-lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease forwards;
      cursor: zoom-out;
    }
    
    .archives-lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.3s ease;
    }
    
    .archives-lightbox.active img {
      opacity: 1;
      transform: scale(1);
    }
    
    .archives-lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      transition: opacity 0.2s ease;
      user-select: none;
    }
    
    .archives-lightbox-close:hover {
      opacity: 0.7;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    button {
      padding: 5px 20px;
      margin: 10px auto;
      border-radius: 10px;
      border : none;
    }

      max-width: 80%;

<script>

    const urlParams = new URLSearchParams(window.location.search);
    const style = urlParams.get("style");

    if (style) {
        let linkElement = document.createElement("link");
        linkElement.rel = "stylesheet";
        linkElement.href = style;
        document.head.appendChild(linkElement);
    }

    document.addEventListener("DOMContentLoaded", function() {
    
        const loader = document.getElementById("loader_div");
        const content = document.getElementById("content");

        // Masquer le loader avec une transition en douceur
        loader.style.opacity = "1";
        loader.style.transition = "opacity 0.5s ease";
        
        // Masquer le loader après la transition
        setTimeout(() => {
        loader.style.opacity = "0";
        setTimeout(() => {
            loader.style.display = "none";
            content.style.display = "block";
        }, 500); // Transition du loader
        }, 500); // Délai de 0.5s pour commencer la transition du loader
    });
  
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = lightbox.querySelector('img');
  const closeBtn = document.getElementById('lightboxClose');
  const prevBtn = document.getElementById('lightboxPrev');
  const nextBtn = document.getElementById('lightboxNext');
  
  let currentIndex = 0;
  let currentImages = [];
  
  // Gestion des onglets de galeries
  function showArchivesGallery(id, clickedTab) {
    document.querySelectorAll('.archives-gallery-section').forEach(section => {
      section.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
  
    document.querySelectorAll('.archives-sidebar li').forEach(li => li.classList.remove('active'));
    clickedTab.classList.add('active');
  }
  
  // Gestion du clic sur une image dans une galerie
  document.querySelectorAll('.archives-gallery-section img').forEach((img) => {
    img.addEventListener('click', (e) => {
      e.stopPropagation(); // Empêche la fermeture de la lightbox
      currentImages = [...img.parentNode.querySelectorAll('img')];
      currentIndex = currentImages.indexOf(img);
      openLightbox(img.src);
    });
  });
  
  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  
  function closeLightbox() {
    lightbox.classList.remove('active');
    lightboxImg.src = '';
    document.body.style.overflow = 'auto';
  }
  
  function showNext() {
    if (!currentImages.length) return;
    currentIndex = (currentIndex + 1) % currentImages.length;
    lightboxImg.src = currentImages[currentIndex].src;
  }
  
  function showPrevious() {
    if (!currentImages.length) return;
    currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
    lightboxImg.src = currentImages[currentIndex].src;
  }
  
  // Événements
  lightbox.addEventListener('click', closeLightbox);
  closeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeLightbox();
  });
  prevBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    showPrevious();
  });
  nextBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    showNext();
  });
  
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;
  
    if (e.key === 'ArrowRight') showNext();
    if (e.key === 'ArrowLeft') showPrevious();
    if (e.key === 'Escape') closeLightbox();
  });

</script>
