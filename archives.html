<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Archives | Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      color: #333;
    }

    .archives-explorer-container {
      display: flex;
      min-height: 100vh;
    }

    .archives-sidebar {
      width: 220px;
      background-color: #1e1e1e;
      color: white;
      padding: 1rem;
      border-right: 2px solid #333;
    }

    .archives-sidebar ul {
      list-style: none;
    }

    .archives-sidebar li {
      cursor: pointer;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
      border-radius: 6px;
      transition: background 0.3s;
    }

    .archives-sidebar li:hover,
    .archives-sidebar li.active {
      background-color: #333;
    }

    .archives-gallery-display {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: flex-start;
      align-items: flex-start;
      background-color: #fafafa;
    }

    .archives-gallery-section {
      display: none;
      width: 100%;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .archives-gallery-section.active {
      display: flex;
    }

    .archives-gallery-section img {
      width: 150px;
      height: auto;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .archives-gallery-section img:hover {
      transform: scale(1.05);
    }

    /* Lightbox */
    .archives-lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
    }

    .archives-lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

    .archives-lightbox.active {
      display: flex;
    }

    @media screen and (max-width: 768px) {
      .archives-explorer-container {
        flex-direction: column;
      }

      .archives-sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 2px solid #333;
      }

      .archives-gallery-display {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Lightbox -->
  <div class="archives-lightbox" id="archives-lightbox">
    <img src="" alt="Preview" />
  </div>

  <script>
    function showArchivesGallery(id, clickedTab) {
      document.querySelectorAll('.archives-gallery-section').forEach(section => {
        section.classList.remove('active');
      });
      document.getElementById("archives-" + id).classList.add('active');

      document.querySelectorAll('.archives-sidebar li').forEach(li => li.classList.remove('active'));
      clickedTab.classList.add('active');
    }

    // Lightbox logic
    const archivesLightbox = document.getElementById('archives-lightbox');
    const archivesLightboxImg = archivesLightbox.querySelector('img');

    document.querySelectorAll('.archives-gallery-section img').forEach(img => {
      img.addEventListener('click', () => {
        archivesLightboxImg.src = img.src;
        archivesLightbox.classList.add('active');
      });
    });

    archivesLightbox.addEventListener('click', () => {
      archivesLightbox.classList.remove('active');
      archivesLightboxImg.src = '';
    });
  </script>

</body>
</html>
