
<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nothing</title>
    <style>
      /* Boîte d'alerte normale */
      #alertBox, #warningBox {
        position: fixed;
        top: 75%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px;
        border-radius: 10px;
        display: none;
        z-index: 1000;
      }

      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        z-index: 999;
      }
    </style>
</head>
<body>
    <!-- --------------------------- SCROLLER --------------------------- -->

  <div id="overlay"></div>

  <!-- Alerte normale -->
  <div id="alertBox">
    <div class="dialogue" onclick="closeAlert()">
        <div>
            <span class="dialogue-character">Astélie</span>
            <div class="dialogue-text" id="dialogue-text">Hey ! Ne scroll pas comme ça ! J'ai travaillé pour écrire tous ces textes !</div>
        </div>
        <img src="../assets/img/illus/nomad1-light.png" class="scroll-chara light-img"/>
        <img src="../assets/img/illus/nomad1-dark.png" class="scroll-chara dark-img"/>
    </div>
    </div>


    <!-- --------------------------- Resources --------------------------- -->


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script>
        function showAlert() {
          alertCount++;
          document.getElementById("alertBox").style.display = "block";
          document.getElementById("overlay").style.display = "block";
          document.body.style.overflow = "hidden";
        }

        function closeAlert() {
          document.getElementById("alertBox").style.display = "none";
          document.getElementById("overlay").style.display = "none";
          document.body.style.overflow = "auto";
          setTimeout(() => alertShown = false, 1500);
        }
    </script>
  </body>
</html>
