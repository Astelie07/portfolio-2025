<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Scène Nomad - Juste Astélie</title>
  <style>
    :root {
      --color-background: #FCF8DA;
      --color-text: #260E03;
      --color-accent: #E0652B;
    }

    body {
      margin: 0;
      background: url('../assets/img/tree-light.png') no-repeat center center/cover;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #app {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 3rem;
      height: 100vh;
      position: relative;
    }

    .dialogue {
      position: relative;
      display: flex;
      flex-direction: column;
      max-height: 50%;
      min-height: 300px;
      min-width: 1024px;
      width: 60%;
      background-color: var(--color-background, rgba(0,0,0,0.8));
      padding: 20px;
      border-radius: 15px;
      cursor: pointer;
    }

    .dialogue-character {
      font-family: "Varela Round", sans-serif;
      font-size: 2rem;
      color: var(--color-text, white);
      background-color: var(--color-accent, #ff0055);
      padding: 10px;
      border-radius: 20px;
      margin-bottom: 10px;
      display: inline-block;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    .dialogue-text {
      font-family: "Hind", sans-serif;
      font-size: 1.5rem;
      color: var(--color-text, white);
    }

    .scroll-chara {
      position: absolute;
      max-width: 350px;
      bottom: 0;
      right: -6rem;
      z-index: 1;
      transition: opacity 1s ease;
    }

    .glitch {
      animation: glitch 0.2s infinite;
    }

    @keyframes glitch {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(2px, -1px); }
      60% { transform: translate(-1px, 1px); }
      80% { transform: translate(1px, -2px); }
      100% { transform: translate(0, 0); }
    }

    .popup {
      position: absolute;
      background: #ff0044;
      color: white;
      padding: 10px;
      border: 2px solid white;
      z-index: 999;
      animation: flicker 0.3s infinite alternate;
    }

    @keyframes flicker {
      from { opacity: 0.6; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="app">
    <div class="dialogue" id="dialogueBox">
      <div>
        <span class="dialogue-character">Astélie</span>
        <div class="dialogue-text" id="dialogueText">Hey... Tu es là ?</div>
      </div>
      <img src="../assets/img/illus/nomad1-light.png" class="scroll-chara" id="character"/>
    </div>
  </div>

  <script>
    const dialogueBox = document.getElementById('dialogueBox');
    const dialogueText = document.getElementById('dialogueText');
    const character = document.getElementById('character');

    const dialogues = [
      "Hey... Tu es là ?",
      "Ça fait longtemps que j'attends.",
      "C'est calme ici... peut-être trop.",
      "Tu entends ce silence ?",
      "Je crois qu'on n'est pas seuls.",
      "...non.",
      "Quelque chose cloche.",
      "Erreur... mémoire corrompue...",
      "Tu n'aurais pas dû venir ici.",
      "Système compromis.",
      "Déconnexion impossible.",
      "CRITICAL ERROR"
    ];

    let index = 0;
    let corrupted = false;

    dialogueBox.addEventListener('click', () => {
      index++;
      if (index < dialogues.length) {
        dialogueText.textContent = dialogues[index];
      }

      if (index === 6 && !corrupted) {
        corrupted = true;
        document.body.style.background = "#000";
        character.classList.add('glitch');
        character.style.opacity = "0.6";
      }

      if (index === 9) {
        character.style.opacity = "0";
        generatePopups();
      }
    });

    function generatePopups() {
    let count = 0;
    let delay = 400;

    function spawnPopup() {
        const popup = document.createElement('div');
        popup.className = 'popup';
        popup.style.left = `${Math.random() * 95}vw`;
        popup.style.top = `${Math.random() * 95}vh`;
        popup.textContent = "ERROR";
        document.body.appendChild(popup);

        count++;
        delay *= 0.85; // accélère progressivement

        if (count < 700) {
        setTimeout(spawnPopup, delay);
        } else {
        // Pause très courte avant l'alerte finale
        setTimeout(() => alert(""), 1000);
        }
    }

    spawnPopup();
    }

  </script>

</body>
</html>
