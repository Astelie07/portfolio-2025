<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Just Monika</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      font-family: 'Courier New', monospace;
      color: white;
      overflow: hidden;
    }

    .scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
    }

    .monika {
      width: 300px;
      position: relative;
      z-index: 1;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    .dialogue-box {
      position: absolute;
      bottom: 50px;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px 40px;
      border: 2px solid white;
      border-radius: 10px;
      max-width: 80%;
      text-align: center;
      z-index: 2;
    }

    /* Effet glitch */
    .monika.glitch {
      animation: glitch 1s infinite;
    }

    @keyframes glitch {
      0% {
        transform: translate(0);
        filter: none;
      }
      20% {
        transform: translate(-2px, 2px);
        filter: hue-rotate(20deg) contrast(1.2);
      }
      40% {
        transform: translate(2px, -1px);
        filter: hue-rotate(-20deg) contrast(1.2);
      }
      60% {
        transform: translate(-1px, 1px);
        filter: hue-rotate(10deg) contrast(1.2);
      }
      80% {
        transform: translate(1px, -2px);
        filter: hue-rotate(-10deg) contrast(1.2);
      }
      100% {
        transform: translate(0);
        filter: none;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <img src="https://i.imgur.com/2vU4FQm.png" alt="Monika" class="monika glitch">
    <div class="dialogue-box">
      <p id="dialogue"></p>
    </div>
  </div>

  <script>
    const text = "Hi there... It's just the two of us now.";
    let i = 0;
    const dialogue = document.getElementById("dialogue");

    function type() {
      if (i < text.length) {
        dialogue.textContent += text.charAt(i);
        i++;
        setTimeout(type, 50);
      }
    }

    type();
  </script>
</body>
</html>
