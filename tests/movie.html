        body {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          background: #000 !important;
        }

        .content {
          border-radius: 40px;
          overflow: hidden;
        }

        .backgroundImage,
        .reflectsImage {
          width: 1280px;
          height: 720px;
          position: absolute;
          top: 0;
          left: 0;
          z-index: 1;
        }

        .backgroundImage {
          filter: brightness(0.5) contrast(1.3);
          opacity: 1;
        }

        .box,
        .blur {
          width: 1280px;
          height: 720px;
          pointer-events: auto;
          position: absolute;
          z-index: 2;
          transform-origin: 0px 0px 0px;
        }

        .box {
          transform: matrix3d(
            0.614952,
            0.147049,
            0,
            0.000199706,
            -0.0178567,
            0.487847,
            0,
            -0.0000312429,
            0,
            0,
            1,
            0,
            137,
            29,
            0,
            1
          );
          transition: transform 10s ease-out;
        }

        .box.no-transform {
          transform: none;
        }

        .box p {
          font-size: 220px;
          text-align: center;
          color: #fff;
          font-weight: 900;
          height: 100%;
          margin: 0;
          text-overflow: ellipsis;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
          line-height: 220px;
          position: absolute;
          mix-blend-mode: exclusion;
          width: 100%;
          height: 100%;
          mix-blend-mode: overlay;
          opacity: 0;
          transition: opacity 1s ease-in-out;
          font-family: "Montserrat", sans-serif;
          font-weight: 900;
        }

        @keyframes fade {
          0% {
            opacity: 0;
          }
          20%,
          80% {
            opacity: 1;
          }
          100% {
            opacity: 0;
          }
        }

        .blur {
          filter: blur(200px) brightness(2) opacity(0.2) contrast(1.5);

              0.614952,

              0,
              0,
              1,
              0,
              137,
              29,
              0,
              1
            )
            scale(1.4);
          margin-left: -90px;
          margin-top: -80px;
        }

<body>
  <div class="container">
    <div class="content" style="display: block; width: 1280px; height: 720px; transform: scale(1.0125);">
      <img class="backgroundImage" src="https://drive.google.com/thumbnail?id=15OERL0IVk9t757DR2Py05y9obsJibQ91&sz=w1000">
      <div class="box">
        <p id="word">Explore</p>
        <iframe width="1280" height="720" class="video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen=""></iframe>
      </div>
      <div class="blur">
        <iframe width="1280" height="720" class="video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen=""></iframe>
      </div>
      <div class="reflects">
        <iframe width="1280" height="720" class="video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen=""></iframe>
      </div>
    </div>
  </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script>
        const videoURL =
          "https://www.youtube.com/embed/hXD8itTKdY0?autoplay=1&amp;mute=1&amp;loop=1&amp;controls=0";

        document.querySelectorAll(".video").forEach((iframe) => {
          iframe.setAttribute("src", videoURL);
        });

        const words = [
          "Explore",
          "Unravel",
          "Journey",
          "Beyond",
          "Glimpse",
          "Infinite",
          "Unseen",
          "Awaken",
          "Unknown",
          "Seek",
          "Curiosity",
          "Voyage"
        ];

        let currentIndex = 0;
        const wordElement = document.getElementById("word");

        function changeWord() {
          wordElement.style.opacity = "0";

          setTimeout(() => {
            wordElement.textContent = words[currentIndex];
            wordElement.style.opacity = "1";

            currentIndex = (currentIndex + 1) % words.length;
          }, 1000);
        }

        setInterval(changeWord, 5000);

        const contentDiv = document.querySelector(".content");

        function adjustContentSize() {
          const viewportWidth = window.innerWidth;

          const baseWidth = 1300;
          const scaleFactor =
            viewportWidth < baseWidth ? (viewportWidth / baseWidth) * 0.8 : 1;

          contentDiv.style.transform = `scale(${scaleFactor})`;
        }

        window.addEventListener("load", adjustContentSize);

        window.addEventListener("resize", adjustContentSize);

        const backgroundImage = document.querySelector(".backgroundImage");
        const reflects = document.querySelector(".reflects");

        function fadeOutBackground() {
          backgroundImage.classList.add("fade-out");
        }

        function fadeOutReflects() {
          reflects.classList.add("fade-out-long");
        }

        setTimeout(fadeOutBackground, 13000);

        setTimeout(fadeOutReflects, 45000);

        const box = document.querySelector(".box");

        function resetTransform() {
          box.classList.add("no-transform");
        }

        function applyInitialTransform() {
          box.classList.remove("no-transform");
        }

        setTimeout(resetTransform, 60000);

    </script>
  </body>
