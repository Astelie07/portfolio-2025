<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge test</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          margin: 0;
          padding: 0;
          background: #f0f0f0;
        }
        
        .content {
          padding: 20px;
          text-align: center;
        }
        
        .lightbox {
          display: none;
          position: fixed;
          inset: 0;
          justify-content: center;
          align-items: center;
          z-index: 1000;
        }
        
        .lightbox-content {
          background: white;
          padding: 20px;
          border-radius: 10px;
          text-align: center;
          animation: fadeIn 0.6s ease;
        }
        
        .image-grid {
          display: flex;
          gap: 10px;
          justify-content: center;
          margin-bottom: 15px;
        }
        
        .selectable-img {
          cursor: pointer;
          transition: transform 0.3s ease, box-shadow 0.3s ease;
          border-radius: 6px;
          position: relative;
          overflow: hidden;
          z-index: 1;
        }
        
        .selectable-img::before {
          content: '';
          position: absolute;
          top: 0;
          left: -100%;
          width: 200%;
          height: 100%;
          background: linear-gradient(
            to right,
            rgba(255, 255, 255, 0) 0%,
            rgba(255, 255, 255, 0.8) 50%,
            rgba(255, 255, 255, 0) 100%
          );
          transform: skewX(-20deg);
          transition: left 0.6s ease;
          z-index: 2;
          pointer-events: none;
        }
        
        .selectable-img:hover::before {
          left: 100%;
        }
        
        .selectable-img:hover {
          transform: scale(1.05);
        }
        
        #chosenImageContainer {
          position: fixed;
          bottom: 20px;
          right: 20px;
          z-index: 1001;
        }
        
        #chosenImageContainer img {
          width: 100px;
          height: auto;
          border-radius: 8px;
          animation: fadeInUp 0.5s ease;
        }
        
        /* Animations */
        @keyframes fadeIn {
          from {
            opacity: 0;
            transform: scale(0.9);
          }
          to {
            opacity: 1;
            transform: scale(1);
          }
        }
        
        @keyframes fadeInUp {
          from {
            opacity: 0;
            transform: translateY(20px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        
        @keyframes shrinkAndFade {
          0% {
            transform: scale(1);
            opacity: 1;
          }
          100% {
            transform: scale(0.3);
            opacity: 0;
          }
        }
        
        .selectable-img.clicked {
          animation: shrinkAndFade 0.5s forwards;
        }
        
        .selectable-image:active,
        .floating-image:active, #chosenImageContainer {
          transform: scale(0.9);
          transition: transform 0.1s ease;
        }
        
        .floating-image {
          width: 100px;
          height: auto;
          border-radius: 8px;
          animation: fadeInUp 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="content">
      <h1>Bienvenue sur ma page !</h1>
      <p>Faites défiler jusqu’en bas pour découvrir une surprise !</p>
      <div style="height: 1500px;"></div> <!-- Pour forcer le scroll -->
    </div>
    
    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
      <div class="lightbox-content">
        <div class="image-grid">
          <img src="https://picsum.photos/id/1015/200/150" alt="Image 1" class="selectable-img" />
          <img src="https://picsum.photos/id/1025/200/150" alt="Image 2" class="selectable-img" />
          <img src="https://picsum.photos/id/1035/200/150" alt="Image 3" class="selectable-img" />
        </div>
        <p>Bravo ! Vous êtes arrivé en bas 🎉 Choisissez votre récompense !</p>
      </div>
    </div>
    
    <!-- Image choisie affichée en bas à droite -->
    <div id="chosenImageContainer"></div>
    
    <audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3" preload="auto"></audio>

    <script>
        let imageChosen = false;  // Variable pour vérifier si une image a été choisie

        // Affiche la lightbox quand on atteint le bas
        window.addEventListener('scroll', function () {
          // Si une image a déjà été choisie, on ne réaffiche pas la lightbox
          if (imageChosen) return;
        
          const scrollPosition = window.innerHeight + window.scrollY;
          const documentHeight = document.documentElement.scrollHeight;
        
          if (scrollPosition >= documentHeight) {
            const lightbox = document.getElementById('lightbox');
            lightbox.style.display = 'flex';
          }
        });
        
        // Gère le clic sur une image
        document.querySelectorAll('.selectable-img').forEach(img => {
          img.addEventListener('click', function () {
            // Si une image a déjà été choisie, on arrête la fonction
            if (imageChosen) return;
        
            const lightbox = document.getElementById('lightbox');
            const chosenContainer = document.getElementById('chosenImageContainer');
            
            // Nettoie les anciennes images dans chosenContainer
            chosenContainer.innerHTML = '';
        
            // Jouer le son
            const sound = document.getElementById('clickSound');
            sound.currentTime = 0;
            sound.play();
        
            // Animation de rétrécissement sur l'image sélectionnée dans la lightbox
            this.classList.add('clicked');
        
            // Après l'animation, cacher la lightbox
            setTimeout(() => {
              lightbox.style.display = 'none';
              
              // Créer l'image flottante pour la placer en bas à droite
              const floatingImg = document.createElement('img');
              floatingImg.src = this.src;
              floatingImg.className = 'floating-image';
              document.body.appendChild(floatingImg);
        
              // Positionner l'image flottante en bas à droite
              floatingImg.style.position = 'fixed';
              floatingImg.style.bottom = '20px';
              floatingImg.style.right = '20px';
              floatingImg.style.zIndex = 1001;
        
              // Appliquer l'animation de scale à l'image flottante
              setTimeout(() => {
                floatingImg.classList.add('clicked');
              }, 10); // Décalage de 10ms pour garantir que l'image soit visible avant l'animation
        
              // Gérer le clic sur l'image flottante
              floatingImg.addEventListener('click', function () {
                // Son
                const sound = document.getElementById('clickSound');
                sound.currentTime = 0;
                sound.play();
        
                // Si l'image flottante n'a pas encore l'animation de rétrécissement, appliquer l'animation
                if (!floatingImg.classList.contains('clicked')) {
                  // Animation de rétrécissement de l'image flottante
                  floatingImg.classList.add('clicked');
        
                  // Supprimer l'image après l'animation
                  setTimeout(() => {
                    floatingImg.remove();
                  }, 500); // doit correspondre à la durée de l'animation
                }
              });
              
              // Marque l'image comme choisie
              imageChosen = true;
            }, 500); // durée de l'animation de la lightbox
          });
        });
    </script>
</body>
</html>
