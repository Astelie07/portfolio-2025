<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="theme" rel="stylesheet" type="text/css" href="assets/css/style.css" />
    <title>Cartes interactives</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
        }
        
        /* Style de la barre latérale */
        .sidebar {
            width: 250px;
            background-color: #333;
            color: white;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
        }
        
        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .sidebar .filter-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            text-align: left;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
            transition: background 0.3s;
        }

        .sidebar .filter-btn:hover {
            background-color: #0056b3;
        }

        .sidebar .filter-btn.active {
            background-color: #004085;
        }

        /* Conteneur principal à droite */
        .container {
            margin-left: 260px; /* Espacement à gauche pour la barre latérale */
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Grande div qui change en fonction de la carte sélectionnée */
        .main-display {
            background-color: #FFA726; /* Orange clair */
            color: white;
            text-align: center;
            padding: 40px;
            border-radius: 15px;
            width: 80%;
            max-width: 900px;
            margin: 20px auto;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* Conteneur des cartes avec scroll horizontal */
        .cards-wrapper {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 10px 30px;
        }
        
        .cards-container {
            display: flex;
            gap: 15px;
            color: white;
        }
        
        .card-details {
            width: 100px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.3s ease-in-out;
            transform: translateY(10px);
            scroll-snap-align: center;
            padding: 10px;
            text-align: center;
            cursor: pointer;
        }

        .card-details img {
            width: 100px;
            height: 100px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .card-details.active {
            opacity: 1;
            transform: translateY(0);
        }

        .filter-btn.active {
            background-color: #004085;
        }
        
        /* Autres styles... */

    </style>
</head>
<body>
    <!-- Barre latérale -->
    <div class="sidebar">
        <h2>Filtres</h2>
        <button class="filter-btn active" data-filter="all">Tout</button>
        <button class="filter-btn ux-ui" data-filter="ux-ui">UX / UI</button>
        <button class="filter-btn video" data-filter="video">Vidéo</button>
        <button class="filter-btn graphisme" data-filter="graphisme">Graphisme</button>
        <button class="filter-btn modelisation" data-filter="modelisation">Modélisation</button>
        <button class="filter-btn jeu-video" data-filter="jeu-video">Jeu vidéo</button>
        <button class="filter-btn dessin" data-filter="dessin">Dessin</button>
    </div>

    <!-- Conteneur principal -->
    <div class="container">
        <!-- Grande div qui change en fonction de la carte sélectionnée -->
        <div class="main-display">
            <h2 id="display-title">Sélectionne une carte</h2>
            <p id="display-content">Clique sur une carte pour afficher son contenu ici.</p>
        </div>

        <!-- Cartes de sélection -->
        <div class="cards-wrapper">
            <div class="cards-container">
                <!-- Exemples de cartes -->
                <div class="card-details ux-ui" data-theme="ux-ui" data-title="Carte 1" data-content="Voici le contenu spécifique de la carte 1.">
                  <h4>Portfolio 2024</h4>
                  <img src="assets/img/portfolio/portfolio-2024.png" class="img-fluid" alt="">
                </div>
                <div class="card-details jeu-video" data-theme="jeu-video" data-title="Carte 2" data-content="Voici le contenu spécifique de la carte 2.">
                  <h4>The Escape</h4>
                  <img src="assets/img/portfolio/escape-min.png" class="img-fluid" alt="">
                </div>
                <!-- Ajoutez vos autres cartes ici -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const filterButtons = document.querySelectorAll(".filter-btn");
            const cards = document.querySelectorAll(".card-details");
            const cardsContainer = document.querySelector(".cards-wrapper");
        
            // Application du filtre
            function applyFilter(filter) {
                cards.forEach(card => {
                    if (filter === "all" || card.getAttribute("data-theme") === filter) {
                        card.classList.remove("hidden");
                        setTimeout(() => card.classList.add("active"), 100);
                    } else {
                        card.classList.remove("active");
                        setTimeout(() => card.classList.add("hidden"), 500);
                    }
                });
        
                // Centrer la première carte visible après filtrage
                setTimeout(() => {
                    const firstVisibleCard = document.querySelector(".card-details:not(.hidden)");
                    if (firstVisibleCard) {
                        centerCard(firstVisibleCard);
                    }
                }, 600);
            }
        
            // Centrer une carte dans la vue
            function centerCard(card) {
                const containerWidth = cardsContainer.offsetWidth;
                const cardOffset = card.offsetLeft - (containerWidth / 2) + (card.offsetWidth / 2);
                
                let currentScroll = cardsContainer.scrollLeft;
                let step = (cardOffset - currentScroll) / 20;
            
                let animation = setInterval(() => {
                    currentScroll += step;
                    cardsContainer.scrollLeft = currentScroll;
        
                    if (Math.abs(currentScroll - cardOffset) < Math.abs(step)) {
                        clearInterval(animation);
                        cardsContainer.scrollLeft = cardOffset;
                    }
                }, 15);
            } 
        
            // Gestion des filtres
            filterButtons.forEach(button => {
                button.addEventListener("click", function() {
                    filterButtons.forEach(b => b.classList.remove("active"));
                    this.classList.add("active");
                    applyFilter(this.getAttribute("data-filter"));
                });
            });
        
            // Sélection d'une carte
            cards.forEach(card => {
                card.addEventListener("click", function() {
                    document.getElementById("display-title").textContent = this.getAttribute("data-title");
                    document.getElementById("display-content").textContent = this.getAttribute("data-content");
                    centerCard(this);
                });
            });
        
            // Activer "Tout afficher" au chargement
            applyFilter("all");
        });
    </script>
</body>
</html>
